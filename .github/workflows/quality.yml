name: Quality
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-gemalink-national.txt
      - run: python scripts/test-gemalink-national.py
      - run: python scripts/test-swc-longbinh-plans.py
      - run: python scripts/test-binhduong-plans.py
      - run: python scripts/test-sgp-pilot-plans.py
      - run: python scripts/test-sgp-pilot-overlap.py
      - run: python scripts/test-sgp-k12-review.py
      - run: pnpm build
      - run: pnpm build:cloudflare
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=${{ matrix.project }}
  check:
    if: ${{ always() }}
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and both browser projects
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$E2E_RESULT" = success
