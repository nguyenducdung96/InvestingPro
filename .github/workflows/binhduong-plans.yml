name: GMD Binh Duong official plans
on:
  workflow_dispatch:
  schedule:
    # 08:55 Vietnam. Manual runs do not establish scheduled-refresh acceptance.
    - cron: '55 1 * * *'
permissions:
  contents: write
concurrency:
  group: binhduong-plans-staging
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cloudflare-next-compat
      - name: Require the staging build hook before publishing data
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::Missing CLOUDFLARE_STAGING_DEPLOY_HOOK; keeping the published edition.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-binhduong-plans.py
      - run: python scripts/refresh-binhduong-plans.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/binhduong-history.test.ts tests/south-plans.test.ts --maxWorkers=1
      - run: pnpm typecheck
      - run: node --test scripts/test-binhduong-deploy.mjs
      - name: Publish validated Binh Duong edition
        run: |
          # No rebase or force push: a competing branch update must reject publication.
          git add packages/modules/port/src/binhduong-history-data.ts packages/modules/port/src/binhduong-journal-loader.ts packages/modules/port/src/binhduong-journal-data docs/catalog-review/binhduong-history-ledger.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(ports): refresh GMD Binh Duong official plans'
            git push origin HEAD:codex/cloudflare-next-compat
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Request Cloudflare staging build
        env:
          CLOUDFLARE_STAGING_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_HOOK }}
        run: node scripts/trigger-binhduong-deploy.mjs
      - name: Reconcile deployed edition
        run: node scripts/verify-binhduong-live.mjs --wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binhduong-readback
          path: .local/binhduong/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
