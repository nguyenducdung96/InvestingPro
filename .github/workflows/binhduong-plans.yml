name: GMD Binh Duong official plans
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: binhduong-plans-staging
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cloudflare-next-compat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-binhduong-plans.py
      - run: python scripts/refresh-binhduong-plans.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/binhduong-history.test.ts tests/south-plans.test.ts --maxWorkers=1
      - run: pnpm typecheck
      - name: Publish validated Binh Duong edition
        run: |
          # No rebase or force push: a competing branch update must reject publication.
          git add packages/modules/port/src/binhduong-history-data.ts packages/modules/port/src/binhduong-journal-loader.ts packages/modules/port/src/binhduong-journal-data docs/catalog-review/binhduong-history-ledger.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(ports): refresh GMD Binh Duong official plans'
            git push origin HEAD:codex/cloudflare-next-compat
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile deployed edition
        run: node scripts/verify-binhduong-live.mjs --wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binhduong-readback
          path: .local/binhduong/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
