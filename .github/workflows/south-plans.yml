name: Southern official authority schedules
run-name: ${{ inputs.probe_only && 'Source connectivity probe' || 'Southern official authority schedules' }}
on:
  workflow_dispatch:
    inputs:
      transport:
        description: Original-source collection location
        type: choice
        default: vps
        options:
          - vps
          - direct
      runner:
        description: Standard hosted runner
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
      probe_only:
        description: Check the public source connection without refreshing or publishing data
        type: boolean
        default: false
  schedule:
    # 08:35 Vietnam. Configuration does not establish a successful scheduled run.
    - cron: '35 1 * * *'
permissions:
  contents: write
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
concurrency:
  group: south-plans-staging
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cloudflare-next-compat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: .local/south-plans
          key: south-plans-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: south-plans-v1-
      - run: python scripts/test-south-plans.py
      - run: python scripts/test-hcm-collector-bundle.py
      - run: node --test scripts/test-south-live.mjs
      - name: Refresh validated historical date forms
        id: collect
        continue-on-error: true
        env:
          HCM_TRANSPORT: ${{ inputs.transport || 'vps' }}
          HCM_PROBE: ${{ inputs.probe_only }}
          HCM_COLLECTOR_HOST: ${{ secrets.HCM_COLLECTOR_HOST }}
          HCM_COLLECTOR_SSH_KEY: ${{ secrets.HCM_COLLECTOR_SSH_KEY }}
          HCM_COLLECTOR_KNOWN_HOSTS: ${{ secrets.HCM_COLLECTOR_KNOWN_HOSTS }}
        run: |
          if [ "$HCM_PROBE" = "true" ]; then
            python scripts/collect-south-plans.py --probe
          elif [ "$HCM_TRANSPORT" = "direct" ]; then
            python scripts/collect-south-plans.py --workers 1 --refresh-recent 4
          else
            python scripts/fetch-hcm-collector.py
            echo "exportable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify archives and compile an immutable edition
        id: compile
        if: steps.collect.outputs.exportable == 'true'
        run: python scripts/export-south-plans.py
      - run: corepack enable
        if: steps.compile.outcome == 'success'
      - run: pnpm install --frozen-lockfile
        if: steps.compile.outcome == 'success'
      - run: pnpm exec vitest run tests/south-plans.test.ts tests/south-history.test.ts tests/north-overview.test.ts --maxWorkers=1
        if: steps.compile.outcome == 'success'
      - run: pnpm typecheck
        if: steps.compile.outcome == 'success'
      - name: Commit validated edition and source errors to staging branch
        id: publish
        if: steps.compile.outcome == 'success'
        run: |
          git add packages/modules/port/src/south-history-data.ts packages/modules/port/src/south-journal-loader.ts packages/modules/port/src/south-journal-data docs/catalog-review/south-history-ledger.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(ports): refresh southern authority schedules'
            git pull --rebase origin codex/cloudflare-next-compat
            git push origin HEAD:codex/cloudflare-next-compat
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for deployed edition and reconcile live monthly metrics
        if: steps.publish.outcome == 'success'
        env:
          COLLECTOR_OUTCOME: ${{ steps.collect.outcome }}
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit }}
        run: node scripts/verify-south-live.mjs
      - name: Record initial source failure without changing published data
        if: always() && steps.collect.outcome == 'failure' && steps.collect.outputs.exportable != 'true'
        env:
          COLLECTOR_OUTCOME: ${{ steps.collect.outcome }}
        run: node scripts/verify-south-live.mjs --source-unavailable
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .local/south-plans
          key: south-plans-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: south-plans-receipt
          path: |
            .local/south-plans/receipt.json
            .local/south-plans/last-run.json
            .local/south-plans/live-readback.json
            .local/south-plans/receipts
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Report source failures after retaining proven data
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
